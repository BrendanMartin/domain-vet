[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domain-vet"
version = "0.1.0"
description = "Score how suspicious a customer's domain is, with explainable reason codes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "dnspython>=2.8",
    "asyncwhois>=1.1.13",
    "whodap",
    "httpx>=0.28",
    "tldextract>=5.3,<6", # asyncwhois 1.1.14 still calls a 5.x deprecated alias
    "rapidfuzz>=3.14",
    "idna>=3.19",
    "disposable-email-domains",
    "free-email-domains",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/domain_vet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:The 'registered_domain' property is deprecated.*:DeprecationWarning:asyncwhois.client",
]
